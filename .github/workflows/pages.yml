name: Publish simulation

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "design/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v5

      - name: Include design previews
        run: cp -R design site/design

      - name: Include experimental Tekapo landscape
        run: |
          mkdir -p site/experimental-landscape
          curl --fail --location --retry 3 --output site/experimental-landscape/tekapo_full_detail_streaming-2.zip https://github.com/miwehle/veski-tekapo-web/releases/download/tekapo-base-scene-236577e/tekapo_full_detail_streaming-2.zip
          echo "af369c56fe6854866f7ffd1c71a36525111d09bb6174cc9a1352cd8ae205173e  site/experimental-landscape/tekapo_full_detail_streaming-2.zip" | sha256sum --check
          cat > site/experimental-landscape/flight.json <<JSON
          {"api": 1, "title": "Cessna 172P - Lake Tekapo", "vehicle": "cessna172", "extension": "cessna172", "base": "tekapo_full_detail_streaming", "package": {"id": "tekapo_full_detail_streaming", "url": "tekapo_full_detail_streaming-2.zip", "bytes": 556449686, "sha256": "af369c56fe6854866f7ffd1c71a36525111d09bb6174cc9a1352cd8ae205173e"}}
          JSON

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
